name: Hercules Develop Build

# Manually triggered: builds the current HEAD of the SDL Hyperion "develop"
# branch and pushes it to Docker Hub as mainframed767/hercules:develop.

on:
  workflow_dispatch:

env:
  IMAGE: mainframed767/hercules

jobs:
  develop:
    name: Build Hercules develop branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/s390x,linux/riscv64
          push: true
          no-cache: true
          build-args: |
            HERCULES_BRANCH=develop
          tags: ${{ env.IMAGE }}:develop
